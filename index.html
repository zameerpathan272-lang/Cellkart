<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cellkart | Shop Smart</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f5f8;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:16px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:900;
  color:#f5c542;
}

.logo span{
  color:#fff;
}

.cart{
  font-size:22px;
}

.search{
  margin-top:15px;
  display:flex;
  background:#fff;
  border-radius:10px;
  overflow:hidden;
}

.search input{
  flex:1;
  border:none;
  outline:none;
  padding:13px;
  font-size:15px;
}

.search button{
  background:#f5c542;
  border:none;
  padding:12px 18px;
}

.categories{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:16px 10px;
  background:white;
}

.category{
  min-width:75px;
  text-align:center;
  font-size:12px;
}

.category div{
  width:55px;
  height:55px;
  background:#f3f3f3;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  margin:auto auto 7px;
}

.banner{
  margin:14px;
  background:linear-gradient(135deg,#161616,#383838);
  color:white;
  padding:25px;
  border-radius:16px;
}

.banner h2{
  font-size:27px;
  color:#f5c542;
}

.banner p{
  margin:10px 0;
  color:#ddd;
}

.banner button{
  padding:10px 18px;
  background:#f5c542;
  border:0;
  border-radius:7px;
  font-weight:bold;
}

.section{
  padding:10px 14px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.section-title h2{
  font-size:20px;
}

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.product{
  background:white;
  border-radius:12px;
  padding:12px;
  position:relative;
  box-shadow:0 2px 8px #00000008;
}

.product img{
  width:100%;
  height:150px;
  object-fit:contain;
}

.heart{
  position:absolute;
  right:12px;
  top:12px;
  border:0;
  background:white;
  font-size:20px;
}

.product h3{
  font-size:14px;
  margin:10px 0;
}

.price{
  font-size:18px;
  font-weight:bold;
}

.old{
  font-size:12px;
  color:#888;
  text-decoration:line-through;
}

.offer{
  color:#16803c;
  font-size:12px;
  margin:5px 0;
}

.add{
  width:100%;
  background:#111;
  color:#fff;
  padding:10px;
  border:none;
  border-radius:7px;
  margin-top:10px;
}

footer{
  background:#111;
  color:white;
  text-align:center;
  padding:25px 15px;
  margin-top:25px;
}

footer span{
  color:#f5c542;
}

.bottom{
  position:sticky;
  bottom:0;
  display:flex;
  justify-content:space-around;
  background:#fff;
  padding:12px 5px;
  border-top:1px solid #ddd;
}

.bottom div{
  font-size:12px;
  text-align:center;
}

@media(min-width:700px){
  .products{
    grid-template-columns:repeat(4,1fr);
  }
  .banner{
    padding:45px;
  }
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">CELL<span>KART</span></div>
    <div class="cart">🛒 <span id="cartCount">0</span></div>
  </div>

  <div class="search">
    <input id="searchInput" placeholder="Search mobiles & accessories..." oninput="searchProducts()">
    <button onclick="searchProducts()">🔍</button>
  </div>
</header>

<div class="categories">
  <div class="category"><div>📱</div>Mobiles</div>
  <div class="category"><div>🎧</div>Audio</div>
  <div class="category"><div>⌚</div>Smartwatch</div>
  <div class="category"><div>🔌</div>Cables</div>
  <div class="category"><div>🔋</div>Chargers</div>
  <div class="category"><div>🛡️</div>Accessories</div>
</div>

<div class="banner">
  <h2>UPGRADE YOUR TECH.</h2>
  <p>Upgrade your vibe. Discover tech that hits different.</p>
  <button onclick="document.getElementById('productsSection').scrollIntoView({behavior:'smooth'})">
    SHOP NOW →
  </button>
</div>

<section class="section" id="productsSection">
  <div class="section-title">
    <h2>🔥 Trending Products</h2>
  </div>

  <div class="products" id="productGrid"></div>
</section>

<footer>
  <h2><span>CELLKART</span></h2>
  <p>Upgrade your tech. Upgrade your vibe.</p>
  <p>© 2026 Cellkart</p>
</footer>

<div class="bottom">
  <div>🏠<br>Home</div>
  <div>☰<br>Categories</div>
  <div onclick="showCart()">🛒<br>Cart</div>
  <div>👤<br>Account</div>
</div>

<script>
const products = [
  {
    name:"MZ WS-887 Wireless Speaker",
    price:0,
    image:"https://via.placeholder.com/300?text=Speaker"
  },
  {
    name:"T800 Ultra Smartwatch",
    price:499,
    image:"https://via.placeholder.com/300?text=Smartwatch"
  },
  {
    name:"120W Fast Charging Cable",
    price:99,
    image:"https://via.placeholder.com/300?text=Charging+Cable"
  }
];

let cart = 0;

function renderProducts(list=products){
  const grid=document.getElementById("productGrid");
  grid.innerHTML="";

  list.forEach((p,index)=>{
    grid.innerHTML+=`
      <div class="product">
        <button class="heart" onclick="this.innerHTML=this.innerHTML==='❤️'?'🤍':'❤️'">🤍</button>
        <img src="${p.image}" alt="${p.name}">
        <h3>${p.name}</h3>
        <div class="price">₹${p.price}</div>
        <div class="offer">Special Store Price</div>
        <button class="add" onclick="addCart()">ADD TO CART</button>
      </div>
    `;
  });
}

function addCart(){
  cart++;
  document.getElementById("cartCount").innerText=cart;
}

function searchProducts(){
  const value=document.getElementById("searchInput").value.toLowerCase();
  const filtered=products.filter(p=>p.name.toLowerCase().includes(value));
  renderProducts(filtered);
}

function showCart(){
  alert("Your cart contains "+cart+" item(s).");
}

renderProducts();
</script>

</body>
</html>
