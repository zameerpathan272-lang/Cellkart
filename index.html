<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CELLKART | M. ACCESSORIES</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#080808;
    color:white;
}

header{
    padding:18px;
    background:#111;
    border-bottom:1px solid #d4af37;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:900;
    color:#d4af37;
}

.logo span{
    color:white;
}

.hero{
    padding:40px 20px;
    background:linear-gradient(135deg,#181818,#000);
    text-align:center;
}

.hero h1{
    font-size:34px;
    margin-bottom:10px;
}

.hero h1 span{
    color:#d4af37;
}

.hero p{
    color:#aaa;
    margin-bottom:20px;
}

.search{
    width:100%;
    max-width:500px;
    padding:14px;
    border:1px solid #333;
    border-radius:30px;
    background:#1a1a1a;
    color:white;
    outline:none;
}

.categories{
    display:flex;
    gap:10px;
    padding:20px;
    overflow-x:auto;
}

.category{
    padding:10px 18px;
    border:1px solid #d4af37;
    border-radius:30px;
    color:#d4af37;
    background:#111;
    white-space:nowrap;
    cursor:pointer;
}

.category.active{
    background:#d4af37;
    color:black;
}

.section-title{
    padding:10px 20px;
    font-size:22px;
}

.products{
    padding:15px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:#141414;
    border:1px solid #242424;
    border-radius:15px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:180px;
    object-fit:contain;
    background:white;
    padding:10px;
}

.card-info{
    padding:12px;
}

.card h3{
    font-size:14px;
    margin-bottom:8px;
}

.price{
    color:#d4af37;
    font-size:18px;
    font-weight:bold;
}

.view-btn{
    margin-top:10px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#d4af37;
    font-weight:bold;
    cursor:pointer;
}

footer{
    text-align:center;
    padding:30px 15px;
    color:#888;
    border-top:1px solid #222;
    margin-top:30px;
}

footer span{
    color:#d4af37;
}

#loading,#empty{
    text-align:center;
    padding:25px;
    color:#d4af37;
}

#empty{
    display:none;
    color:#aaa;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.88);
    z-index:999;
    padding:15px;
    overflow:auto;
}

.modal-content{
    background:#151515;
    border:1px solid #d4af37;
    max-width:450px;
    margin:30px auto;
    border-radius:18px;
    padding:20px;
    position:relative;
}

.modal-content img{
    width:100%;
    height:250px;
    object-fit:contain;
    background:white;
    border-radius:12px;
}

.modal-content h2{
    margin-top:15px;
}

.modal-content p{
    margin-top:10px;
    color:#bbb;
    line-height:1.5;
}

.close{
    position:absolute;
    right:15px;
    top:10px;
    font-size:28px;
    color:#d4af37;
    cursor:pointer;
}

.order-btn{
    display:block;
    margin-top:20px;
    background:#20c763;
    color:white;
    text-align:center;
    padding:14px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

@media(min-width:700px){
    .products{
        grid-template-columns:repeat(4,1fr);
        padding:25px;
    }

    .hero h1{
        font-size:48px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">CELL<span>KART</span></div>
    <div style="color:#d4af37;font-size:12px">M. ACCESSORIES</div>
</header>

<section class="hero">
    <h1>UPGRADE YOUR <span>TECH</span></h1>
    <p>Accessories that hit different ⚡</p>

    <input type="search"
    id="search"
    class="search"
    placeholder="Search products...">
</section>

<div class="categories" id="categories"></div>

<h2 class="section-title">⚡ Trending Products</h2>

<div id="loading">Loading products...</div>
<div class="products" id="products"></div>
<div id="empty">No products found 😕</div>

<footer>
    <p><span>CELLKART / सेलकर्ट</span></p>
    <p style="margin-top:10px">पुराने फोन लिए और बेचे जाते हैं</p>
    <p style="margin-top:8px">© CELLKART M. ACCESSORIES</p>
    <p style="margin-top:8px">WhatsApp: 7776818542</p>
</footer>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>
        <img id="modalImage" src="" alt="Product">
        <h2 id="modalName"></h2>
        <h3 class="price" id="modalPrice"></h3>
        <p id="modalDescription"></p>
        <a id="orderLink" class="order-btn" target="_blank">
            Order on WhatsApp
        </a>
    </div>
</div>

<script>

/* SUPABASE SETTINGS */

const SUPABASE_URL =
"https://glbxinezbhlngtcwbzbu.supabase.co";

const SUPABASE_KEY =
"PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY";

/* CELLKART WHATSAPP */

const WHATSAPP_NUMBER = "917776818542";

/* APP */

let allProducts = [];
let currentCategory = "all";

const productsDiv = document.getElementById("products");
const loading = document.getElementById("loading");
const empty = document.getElementById("empty");
const searchInput = document.getElementById("search");

/* LOAD PRODUCTS */

async function loadProducts(){

    try{

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/products?select=*`,
            {
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":`Bearer ${SUPABASE_KEY}`
                }
            }
        );

        if(!response.ok){
            throw new Error("Supabase connection error");
        }

        allProducts = await response.json();

        loading.style.display="none";

        createCategories();
        displayProducts(allProducts);

    }catch(error){

        loading.innerText =
        "Products load nahi ho rahe. Supabase settings check karein.";

        console.error(error);
    }
}

/* CATEGORIES */

function createCategories(){

    const categoriesDiv =
    document.getElementById("categories");

    const categories=[
        "all",
        ...new Set(
            allProducts
            .map(p=>p.category)
            .filter(Boolean)
        )
    ];

    categoriesDiv.innerHTML="";

    categories.forEach(category=>{

        const btn=document.createElement("button");

        btn.className="category"+
        (category===currentCategory?" active":"");

        btn.textContent=
        category==="all"?"All":category;

        btn.onclick=()=>{

            currentCategory=category;

            document.querySelectorAll(".category")
            .forEach(b=>b.classList.remove("active"));

            btn.classList.add("active");

            filterProducts();
        };

        categoriesDiv.appendChild(btn);
    });
}

/* PRODUCTS */

function displayProducts(products){

    productsDiv.innerHTML="";

    empty.style.display=
    products.length?"none":"block";

    products.forEach(product=>{

        const card=document.createElement("div");
        card.className="card";

        const image=
        product.image_url||
        product.image||
        "";

        const name=
        product.name||
        product.title||
        "Product";

        const price=product.price||0;

        card.innerHTML=`
            <img src="${image}" alt="Product">
            <div class="card-info">
                <h3></h3>
                <div class="price">₹${price}</div>
                <button class="view-btn">View Product</button>
            </div>
        `;

        card.querySelector("h3").textContent=name;

        card.querySelector(".view-btn").onclick=()=>{
            openModal(product);
        };

        card.querySelector("img").onclick=()=>{
            openModal(product);
        };

        productsDiv.appendChild(card);
    });
}

/* SEARCH */

function filterProducts(){

    const searchText=
    searchInput.value.toLowerCase().trim();

    let filtered=allProducts;

    if(currentCategory!=="all"){
        filtered=filtered.filter(p=>
            p.category===currentCategory
        );
    }

    if(searchText){
        filtered=filtered.filter(p=>
            (p.name||p.title||"")
            .toLowerCase()
            .includes(searchText)
        );
    }

    displayProducts(filtered);
}

searchInput.addEventListener("input",filterProducts);

/* PRODUCT PREVIEW */

function openModal(product){

    const image=
    product.image_url||
    product.image||
    "";

    const name=
    product.name||
    product.title||
    "Product";

    const price=product.price||0;

    document.getElementById("modalImage").src=image;
    document.getElementById("modalName").textContent=name;
    document.getElementById("modalPrice").textContent="₹"+price;

    document.getElementById("modalDescription").textContent=
    product.description||"Available at CELLKART.";

    const message=
    `Hello CELLKART! I want to order ${name} for ₹${price}.`;

    document.getElementById("orderLink").href=
    `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;

    document.getElementById("modal").style.display="block";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

document.getElementById("modal").onclick=function(e){
    if(e.target===this){
        closeModal();
    }
};

/* START WEBSITE */

loadProducts();

</script>

</body>
</html>
